---
name: Spring Boot CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

# Permissions for GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:

  # ============================================================
  # CI JOB
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout source code
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Setup Java 17
      # ----------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ----------------------------------------------------------
      # 3. Verify Java
      # ----------------------------------------------------------
      - name: Verify Java
        run: java -version

      # ----------------------------------------------------------
      # 4. Build application
      # ----------------------------------------------------------
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # ----------------------------------------------------------
      # 5. Run tests
      # ----------------------------------------------------------
      - name: Run tests
        run: mvn test


  # ============================================================
  # DOCKER JOB
  # ============================================================
  docker:
    name: Build and Push Docker Image

    # Docker image is pushed ONLY for actual branch pushes.
    # It will NOT run for pull_request events.
    if: github.event_name == 'push'

    needs: build

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Checkout source code
      # ----------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Get short Git SHA
      # ----------------------------------------------------------
      - name: Get Git SHA
        id: git
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # 3. Login to GitHub Container Registry
      # ----------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 4. Build and Push Docker Image
      # ----------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest

      # ----------------------------------------------------------
      # 5. Display image information
      # ----------------------------------------------------------
      - name: Print Docker Image Information
        run: |
          echo "=========================================="
          echo "DOCKER IMAGE PUBLISHED"
          echo "=========================================="
          echo "Repository : ${{ github.repository }}"
          echo "Commit SHA : ${{ steps.git.outputs.sha }}"
          echo "Image      : ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"
          echo "Latest     : ghcr.io/${{ github.repository }}:latest"
          echo "=========================================="

