name: Spring Boot CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# GITHUB_TOKEN permissions
permissions:
  contents: read
  packages: write

jobs:

  build:
    name: Build, Test and Publish Image
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout source
      # ==========================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Setup Java 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # ==========================================================
      # 3. Verify Java
      # ==========================================================
      - name: Verify Java
        run: |
          java -version
          mvn -version

      # ==========================================================
      # 4. Build Spring Boot JAR
      # ==========================================================
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # ==========================================================
      # 5. VERIFY target directory
      # ==========================================================
      - name: Verify JAR
        shell: bash
        run: |
          echo "======================================"
          echo "TARGET DIRECTORY"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "target:"
          ls -la target

          echo ""
          echo "JAR files:"
          find target -maxdepth 1 -type f -name "*.jar" -print

      # ==========================================================
      # 6. Run tests
      # ==========================================================
      - name: Run tests
        run: mvn test

      # ==========================================================
      # 7. Get Git SHA
      # ==========================================================
      - name: Get commit SHA
        id: git
        shell: bash
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Commit SHA: $SHA"

      # ==========================================================
      # 8. Login to GHCR
      # Only publish for push events
      # ==========================================================
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # 9. Build and Push Docker Image
      # Only publish for push events
      # ==========================================================
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest

      # ==========================================================
      # 10. Display image information
      # ==========================================================
      - name: Print image information
        if: github.event_name == 'push'
        run: |
          echo "======================================"
          echo "DOCKER IMAGE PUBLISHED"
          echo "======================================"
          echo "Image:"
          echo "ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"
          echo ""
          echo "Latest:"
          echo "ghcr.io/${{ github.repository }}:latest"
