name: Spring Boot CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up JDK
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --------------------------------------------------
      # 3. Get Git SHA
      # --------------------------------------------------
      - name: Get commit SHA
        id: git
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 4. Build with Maven
      # --------------------------------------------------
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # --------------------------------------------------
      # 5. Run tests
      # --------------------------------------------------
      - name: Run tests
        run: mvn test

      # --------------------------------------------------
      # 6. Login to GHCR
      # --------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 7. Build and push Docker image
      # --------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # 8. Print image info
      # --------------------------------------------------
      - name: Print image info
        run: |
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo "Image: ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"
          echo "Latest: ghcr.io/${{ github.repository }}:latest"
