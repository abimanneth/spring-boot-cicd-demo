name: Spring Boot CD

on:
  workflow_run:
    workflows:
      - Spring Boot CI
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:

      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Get commit SHA
        id: git
        shell: powershell
        run: |
          $sha = git rev-parse --short HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Show deployment information
        shell: powershell
        run: |
          Write-Host "Commit: ${{ steps.git.outputs.sha }}"
          podman --version

      - name: Login to GHCR
        shell: powershell
        run: |
          $env:CR_PAT = "${{ secrets.GITHUB_TOKEN }}"
          $env:CR_PAT | podman login ghcr.io `
            --username "${{ github.actor }}" `
            --password-stdin

      - name: Pull image from GHCR
        shell: powershell
        run: |
          podman pull "ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"

      - name: Stop old container
        shell: powershell
        run: |
          podman stop spring-boot-cicd-demo 2>$null
          podman rm spring-boot-cicd-demo 2>$null
          exit 0

      - name: Deploy Spring Boot
        shell: powershell
        run: |
          podman run -d `
            --name spring-boot-cicd-demo `
            -p 8081:8081 `
            "ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"

      - name: Show running container
        shell: powershell
        run: |
          podman ps
