name: Spring Boot CD

on:
  workflow_run:
    workflows:
      - Spring Boot CI
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:

      # --------------------------------------------------
      # 1. Checkout the exact commit that CI built
      # --------------------------------------------------
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # --------------------------------------------------
      # 2. Get Git SHA
      # --------------------------------------------------
      - name: Get commit SHA
        id: git
        shell: powershell
        run: |
          $sha = git rev-parse --short HEAD
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # --------------------------------------------------
      # 3. Display deployment information
      # --------------------------------------------------
      - name: Show deployment information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Spring Boot CD"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "CI commit:"
          Write-Host "${{ github.event.workflow_run.head_sha }}"
          Write-Host ""
          Write-Host "Checked out commit:"
          git rev-parse HEAD
          Write-Host ""
          Write-Host "Short SHA:"
          Write-Host "${{ steps.git.outputs.sha }}"
          Write-Host ""
          Write-Host "Podman version:"
          podman --version

      # --------------------------------------------------
      # 4. Login to GHCR
      # --------------------------------------------------
      - name: Login to GitHub Container Registry
        shell: powershell
        run: |
          Write-Host "Logging in to GHCR..."
          "${{ secrets.GITHUB_TOKEN }}" |
            podman login ghcr.io `
              --username "${{ github.actor }}" `
              --password-stdin
          Write-Host "Login successful"

      # --------------------------------------------------
      # 5. Pull image created by CI
      # --------------------------------------------------
      - name: Pull Docker image from GHCR
        shell: powershell
        run: |
          $IMAGE = "ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"

          Write-Host "Pulling image:"
          Write-Host $IMAGE
          Write-Host ""

          podman pull $IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull image"
          }

      # --------------------------------------------------
      # 6. Stop existing application
      # --------------------------------------------------
      - name: Stop old container
        shell: powershell
        run: |
          Write-Host "Stopping old container if exists..."
          podman stop spring-boot-cicd-demo 2>$null
          podman rm spring-boot-cicd-demo 2>$null
          Write-Host "Old container stopped/removed"

      # --------------------------------------------------
      # 7. Deploy new container
      # --------------------------------------------------
      - name: Deploy Spring Boot application
        shell: powershell
        run: |
          $IMAGE = "ghcr.io/${{ github.repository }}:${{ steps.git.outputs.sha }}"

          Write-Host "Starting new container..."
          Write-Host $IMAGE
          Write-Host ""

          podman run -d `
            --name spring-boot-cicd-demo `
            -p 8081:8081 `
            $IMAGE

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start container"
          }

          Write-Host "Container started successfully"

      # --------------------------------------------------
      # 8. Wait for Spring Boot
      # --------------------------------------------------
      - name: Wait for application startup
        shell: powershell
        run: |
          Write-Host "Waiting 15 seconds for Spring Boot to start..."
          Start-Sleep -Seconds 15
          Write-Host "Wait complete"

      # --------------------------------------------------
      # 9. Show running containers
      # --------------------------------------------------
      - name: Show running container
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Running Containers"
          Write-Host "======================================"
          podman ps

      # --------------------------------------------------
      # 10. Verify deployed image
      # --------------------------------------------------
      - name: Verify deployed image
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Deployed Image Details"
          Write-Host "======================================"

          podman inspect spring-boot-cicd-demo `
            --format "{{.ImageName}}"

      # --------------------------------------------------
      # 11. Show application logs
      # --------------------------------------------------
      - name: Show application logs
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Application Logs"
          Write-Host "======================================"
          podman logs spring-boot-cicd-demo

      # --------------------------------------------------
      # 12. Health check / endpoint check
      # --------------------------------------------------
      - name: Test Spring Boot endpoint
        shell: powershell
        run: |
          $url = "http://localhost:8081/api/v1/hello"
          $maxAttempts = 5
          $attempt = 0

          Write-Host "Testing endpoint: $url"
          Write-Host ""

          while ($attempt -lt $maxAttempts) {
            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -ErrorAction Stop

              Write-Host "HTTP Status: $($response.StatusCode)"
              Write-Host "Response: $($response.Content)"
              Write-Host ""

              if ($response.StatusCode -eq 200) {
                Write-Host "Endpoint test PASSED"
                exit 0
              }
            }
            catch {
              $attempt++
              if ($attempt -lt $maxAttempts) {
                Write-Host "Attempt $attempt failed, retrying in 3 seconds..."
                Start-Sleep -Seconds 3
              }
            }
          }

          throw "Application endpoint check failed after $maxAttempts attempts"

      # --------------------------------------------------
      # 13. Deployment successful
      # --------------------------------------------------
      - name: Deployment successful
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Application URL:"
          Write-Host "http://localhost:8081/api/v1/hello"
          Write-Host ""
          Write-Host "Short SHA: ${{ steps.git.outputs.sha }}"
